[project]
name = "mcp-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deepak singh", email = "deepakniu09@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "mcp[cli]>=1.29.0",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
mcp-tutorial = "mcp_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = [
    "01_simple_math",
    "02_expense_tracker",
    "03_devops_mcp"
]